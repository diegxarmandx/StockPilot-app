# Optional local fallback. Primary development uses Supabase via backend DB_* variables.
services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-stockpilot}
      POSTGRES_USER: ${LOCAL_DB_USERNAME:-stockpilot}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD for the optional local database}
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
